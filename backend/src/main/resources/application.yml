server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: city-party-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:city_party_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:city_party}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

city-party:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
  jwt:
    secret: ${JWT_SECRET}
    expire-minutes: ${JWT_EXPIRE_MINUTES:4320}
  password:
    salt: ${PASSWORD_SALT:cityparty}
  security:
    trusted-proxies: ${TRUSTED_PROXIES:}
    registration:
      max-attempts: ${REGISTRATION_MAX_ATTEMPTS:5}
      window-seconds: ${REGISTRATION_WINDOW_SECONDS:600}
      challenge-max-attempts: ${REGISTRATION_CHALLENGE_MAX_ATTEMPTS:20}
      challenge-window-seconds: ${REGISTRATION_CHALLENGE_WINDOW_SECONDS:300}
      verify-max-attempts: ${REGISTRATION_VERIFY_MAX_ATTEMPTS:30}
      verify-window-seconds: ${REGISTRATION_VERIFY_WINDOW_SECONDS:300}
  upload:
    base-dir: ${UPLOAD_BASE_DIR:uploads}
    avatar-dir: avatar
    activity-dir: activity
    public-prefix: /uploads
